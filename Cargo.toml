[workspace]
exclude = ["engines/olmoe", "engines/qwen3", "engines/qwen3-coder"]
members = [
  "chat-formats/*",
  "crates/*",
  "support/forja-testing",
  "support/golden-fixtures",
  "support/test-guests",
]
resolver = "3"

[profile.dev]
debug = "line-tables-only"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.98.1"
version = "0.0.0"

[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "json",
  "tokio",
] }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
clap = { version = "4.5", default-features = false, features = [
  "derive",
  "error-context",
  "help",
  "std",
  "usage",
] }
memmap2 = "0.9"
minijinja = { version = "2.12", default-features = false, features = [
  "adjacent_loop_items",
  "builtins",
  "fuel",
  "json",
  "macros",
  "multi_template",
  "serde",
] }
minijinja-contrib = { version = "2.12", default-features = false, features = [
  "pycompat",
] }
safetensors = "0.6"
serde = "1.0"
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.51", features = [
  "net",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-stream = "0.1"
tokenizers = { version = "0.22", default-features = false, features = [
  "fancy-regex",
] }
toml = "1.0"
wasmparser = { version = "0.258", default-features = false, features = [
  "component-model",
  "std",
] }
wasmtime = { version = "49", default-features = false, features = [
  "component-model-async",
  "component-model",
  "cranelift",
  "runtime",
] }
wasmtime-wasi = { version = "49", default-features = false, features = ["p2"] }
wit-component = "0.258"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = "warn"
