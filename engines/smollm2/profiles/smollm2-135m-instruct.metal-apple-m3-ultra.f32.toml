schema-version = 1
family = "smollm2"
default-tunings = ["optimized", "fused-epilogues"]

[model]
id = "HuggingFaceTB/SmolLM2-135M-Instruct"
revision = "12fd25f77366fa6b3b4b768ec3050bf629380bac"
weights-sha256 = "sha256:5af571cbf074e6d21a03528d2330792e532ca608f24ac70a143f6b369968ab8c"

[target]
component = "wasm32-wasip2"
backend = "metal"
device-family = "apple-m3-ultra"

[numerics]
activations = "f32"
weights = "f32"

[workload]
kind = "causal-lm"
batch = 1
max-context = 8192
prefill-chunk = 512

[serving]
paged-cache = true
prompt-token-budget = 512

[variants.fixed]
"dense.decode" = "matmul.gemv-transposed"
"dense.prefill" = "matmul.steel-32x64x16-1x2"
"attention.decode" = "sdpa.decomposed"
"attention.prefill" = "sdpa.steel"
"paged-attention.decode" = "paged-sdpa.vector"
"paged-attention.prefill" = "paged-sdpa.steel"
