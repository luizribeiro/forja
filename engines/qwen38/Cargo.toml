[workspace]
members = ["."]
resolver = "3"

[package]
name = "qwen38"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.99.1"
version = "0.0.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["component", "metal-variants"]
component = []
metal-variants = ["forja-sdk/metal-variants"]

[dependencies]
forja-sdk = { path = "../../crates/forja-sdk" }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
