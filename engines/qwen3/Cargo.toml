[workspace]
members = ["."]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
version = "0.0.0"

[workspace.lints.clippy]
pedantic = "warn"

[package]
name = "qwen3"
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false
rust-version.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
all-fusions = []
bf16 = []
default = ["all-fusions"]
final-norm-only = []
no-replay = []
qk-norm-rope-only = []
residual-norm-only = []
silu-mul-only = []

[dependencies]
forja-sdk = { path = "../../crates/forja-sdk", features = ["metal-variants"] }

[lints]
workspace = true
