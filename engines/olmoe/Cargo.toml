[workspace]
members = ["."]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
version = "0.0.0"

[workspace.lints.clippy]
pedantic = "warn"

[package]
name = "olmoe"
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false
rust-version.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
forja-sdk = { path = "../../crates/forja-sdk", features = ["metal-variants"] }

[lints]
workspace = true
