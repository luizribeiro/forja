name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    env:
      FORJA_NO_GPU: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Verify arm64 runner
        run: test "$(uname -m)" = arm64
      - uses: ./.github/actions/setup-nix
      - name: Check flake
        run: nix flake check
      - name: Run pre-commit hooks
        run: nix develop -c pre-commit run --all-files --show-diff-on-failure
      - name: Run pre-push hooks
        run: nix develop -c pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure
      - name: Check dependency advisories
        run: |
          for manifest in Cargo.toml engines/*/Cargo.toml; do
            nix develop -c cargo deny --manifest-path "$manifest" check advisories
          done
