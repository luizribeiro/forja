[workspace]
members = [
  "engine-smoke",
  "engine-sdk-smoke",
  "hello",
  "metal-variant-smoke",
  "program-smoke",
  "rmsnorm-smoke",
  "qwen3-coder",
  "sdk-smoke",
  "tensor-abuse",
  "tensor-smoke",
  "toy-mlp",
  "weights-smoke",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
version = "0.0.0"

[workspace.dependencies]
forja-sdk = { path = "../../crates/forja-sdk" }
wit-bindgen = "0.62"

[workspace.lints.clippy]
pedantic = "warn"
