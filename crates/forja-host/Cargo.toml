[package]
name = "forja-host"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
forja-core = { path = "../forja-core" }
forja-program-conversions = { path = "../forja-program-conversions" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
forja-metal = { path = "../forja-metal" }

[dev-dependencies]
forja-config = { path = "../forja-config" }
forja-cpu = { path = "../forja-cpu" }
forja-testing = { path = "../../support/forja-testing" }
golden-fixtures = { path = "../../support/golden-fixtures" }
olmoe = { path = "../../engines/olmoe" }
qwen3 = { path = "../../engines/qwen3" }
qwen3-coder = { path = "../../engines/qwen3-coder" }
forja-sdk = { path = "../forja-sdk", features = ["native-metal"] }
test-guests = { path = "../../support/test-guests" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toy-mlp = { path = "../../support/guests/toy-mlp" }

[lints]
workspace = true
