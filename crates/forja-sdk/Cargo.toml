[package]
name = "forja-sdk"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
native = ["dep:forja-core", "dep:forja-cpu", "dep:forja-host"]
native-metal = ["native", "dep:forja-metal"]

[dependencies]
forja-sdk-macros = { path = "../forja-sdk-macros" }
forja-program-conversions = { path = "../forja-program-conversions" }
forja-core = { path = "../forja-core", optional = true }
forja-cpu = { path = "../forja-cpu", optional = true }
forja-host = { path = "../forja-host", optional = true }
half = "2"

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
forja-metal = { path = "../forja-metal", optional = true }

[dev-dependencies]
forja-testing = { path = "../../support/forja-testing" }
golden-fixtures = { path = "../../support/golden-fixtures" }
trybuild = "1"

[lints]
workspace = true
