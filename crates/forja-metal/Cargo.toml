[package]
name = "forja-metal"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
forja-core = { path = "../forja-core" }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "NSString",
] }
objc2-metal = { version = "0.3", default-features = false, features = [
  "std",
  "MTL4ArgumentTable",
  "MTL4CommandAllocator",
  "MTL4CommandBuffer",
  "MTL4CommandEncoder",
  "MTL4CommandQueue",
  "MTL4ComputeCommandEncoder",
  "MTLAllocation",
  "MTLBuffer",
  "MTLCommandEncoder",
  "MTLComputePipeline",
  "MTLDataType",
  "MTLDevice",
  "MTLEvent",
  "MTLFunctionConstantValues",
  "MTLGPUAddress",
  "MTLLibrary",
  "MTLResource",
  "MTLTypes",
] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = "warn"
