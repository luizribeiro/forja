[package]
name = "forja-metal"
autotests = false
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[[test]]
name = "metal"
path = "tests/metal/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
forja-core = { path = "../forja-core" }
mach2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "NSZone",
  "NSString",
] }
objc2-metal = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "MTL4ArgumentTable",
  "MTL4CommandAllocator",
  "MTL4CommandBuffer",
  "MTL4CommandEncoder",
  "MTL4CommandQueue",
  "MTL4CommitFeedback",
  "MTL4ComputeCommandEncoder",
  "MTL4Counters",
  "MTLAllocation",
  "MTLBuffer",
  "MTLCommandEncoder",
  "MTLComputePipeline",
  "MTLDataType",
  "MTLDevice",
  "MTLEvent",
  "MTLFunctionConstantValues",
  "MTLGPUAddress",
  "MTLIndirectCommandBuffer",
  "MTLIndirectCommandEncoder",
  "MTLLibrary",
  "MTLResidencySet",
  "MTLResource",
  "MTLTypes",
] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = "warn"

[target.'cfg(target_os = "macos")'.dev-dependencies]
forja-cpu = { path = "../forja-cpu", features = ["test-oracles"] }
forja-testing = { path = "../../support/forja-testing" }
half = "2"
proptest = "1.9"
