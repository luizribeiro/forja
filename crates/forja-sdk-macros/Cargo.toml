[package]
name = "forja-sdk-macros"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
forja-core = { path = "../forja-core" }
forja-cpu = { path = "../forja-cpu" }
forja-testing = { path = "../../support/forja-testing" }
proptest = "1"

[lints]
workspace = true
